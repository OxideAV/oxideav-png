[package]
name = "oxideav-png-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"
# libloading is the only libpng interop: each cross-decode harness
# `dlopen`s the system-installed libpng at startup. No `*-sys` crate,
# no libpng source pulled into the dep tree. Harnesses skip silently
# when libpng isn't installed (see fuzz/src/lib.rs).
libloading = "0.8"

[dependencies.oxideav-png]
path = ".."

[lib]
name = "oxideav_png_fuzz"
path = "src/lib.rs"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

# Decode-only target: feed arbitrary bytes straight at the standalone
# decode entry points. No oracle / no encode round-trip — purely asserts
# the decoder never panics / aborts / OOMs on hostile input.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "png_self_roundtrip"
path = "fuzz_targets/png_self_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "libpng_encode_oxideav_decode"
path = "fuzz_targets/libpng_encode_oxideav_decode.rs"
test = false
doc = false

[[bin]]
name = "oxideav_encode_libpng_decode"
path = "fuzz_targets/oxideav_encode_libpng_decode.rs"
test = false
doc = false

# APNG-frame-walk: build a valid base APNG with the standalone encoder,
# then mutate every fcTL chunk's dispose_op/blend_op/x_offset/y_offset
# with fuzz-derived values (recomputing CRC32 so the parser accepts it),
# and drive `parse_apng` + `decode_apng_info`. Exercises the composite
# state machine — disposal snapshots, background clears, out-of-canvas
# offsets, and alpha blending — across 1-8-frame chains.
[[bin]]
name = "apng_frame_walk"
path = "fuzz_targets/apng_frame_walk.rs"
test = false
doc = false

# Standalone encode→decode→re-encode round-trip for both static PNG and
# APNG entry points. Asserts the decoder is a right inverse of the
# encoder on encoder-emitted bitstreams, then re-encodes + re-decodes
# to confirm image-level idempotence. Mirrors the gif/mp4/mkv/tiff
# roundtrip shape; covers the no-`oxideav-core` standalone API path.
[[bin]]
name = "encode_decode_roundtrip"
path = "fuzz_targets/encode_decode_roundtrip.rs"
test = false
doc = false

# Encode-options matrix target (r296). Drives
# `encode_png_image_with_options` over the option space the default
# round-trip target never visits: Adam7 interlace (>=8-bit + sub-byte
# 1/2/4-bit passes), caller-supplied sub-byte `bit_depth` packing,
# every `FilterStrategy` variant (Adaptive + Fixed x5), and the
# ancillary-metadata emission path. Decodes accepted output through
# `decode_png` + `decode_png_to_rgba`. Asserts liveness on the
# option-bearing encode path and decode-liveness + dimension
# preservation on its output.
[[bin]]
name = "encode_options"
path = "fuzz_targets/encode_options.rs"
test = false
doc = false

# Per-row-filter round-trip target (r234). Drives `filter_row` +
# `unfilter_row` directly with fuzz-derived (FilterType, bpp, row_size,
# prev_row, row) tuples — bypasses the chunk-CRC / IDAT-inflate / IHDR-
# shape gates so the mutation budget lands inside the §6.2..§6.6
# reconstruction arithmetic. Asserts (1) liveness on all five filter
# types across bpp ∈ 1..=8, and (2) the §6.1 reversibility property
# `unfilter(filter(row)) == row` for every shape sampled.
[[bin]]
name = "filter_roundtrip"
path = "fuzz_targets/filter_roundtrip.rs"
test = false
doc = false

# Metadata-chunk splice target (r319). Builds a valid 8x8 base PNG
# (grayscale / RGB / palette) with the standalone encoder, then splices
# 1..=8 fuzz-derived ancillary chunks — type drawn from the
# `parse_metadata` dispatch set (sBIT pHYs tIME bKGD hIST tRNS eXIf sRGB
# cICP gAMA cHRM mDCV cLLI sPLT tEXt zTXt iCCP iTXt), payload
# fuzz-controlled — immediately before IEND with a real length prefix +
# CRC32. Funnels the mutation budget *inside* the per-chunk `::parse`
# routines (keyword / NUL splitting, the compression-method byte, the
# zlib inflate of zTXt / iTXt / iCCP bodies, sPLT entry strides, the eXIf
# TIFF probe, bKGD / hIST PLTE-index bounds) that the raw-bytes `decode`
# target rarely reaches past the signature / framing / CRC gate. Drives
# `parse_metadata` + `decode_png` + `decode_png_to_rgba`; liveness only.
[[bin]]
name = "metadata_chunk_splice"
path = "fuzz_targets/metadata_chunk_splice.rs"
test = false
doc = false

# Region-aware APNG encode target (r341). Drives
# `encode_apng_frames_with_options` directly with fuzz-derived per-frame
# sub-regions (width/height + x_offset/y_offset spanning the in-canvas /
# on-edge / out-of-canvas bands), rational delays, every dispose+blend
# operator, the separate-default-image vs first-frame-is-default branch,
# and Adam7 interlace. Asserts encode liveness and — on the happy path —
# that any accepted encode re-decodes through `decode_apng` to exactly
# the submitted frame count at the submitted canvas dimensions. Funnels
# the budget into the encoder's fcTL-emission / fdAT-framing / synthetic-
# per-frame-IHDR compression path that `apng_frame_walk` (which mutates a
# pre-built stream) never reaches.
[[bin]]
name = "apng_region_encode"
path = "fuzz_targets/apng_region_encode.rs"
test = false
doc = false
