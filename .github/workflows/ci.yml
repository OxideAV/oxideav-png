name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  # Standalone (no-`registry`) verification — the image-crate contract
  # (IMAGE_CRATE_API): image-library consumers depend on the crate with
  # `default-features = false` to skip the `oxideav-core` dep tree
  # entirely, so the whole Layer-1 surface (`probe` / `info` / `decode*`
  # / `encode*`) must build AND pass its tests without the framework.
  # Tests that exercise the trait integration are `#![cfg(feature =
  # "registry")]` and drop out of this run.
  ci-standalone:
    name: Build + test (no registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: standalone
      - name: cargo build --lib --no-default-features
        run: cargo build --lib --no-default-features --verbose
      - name: cargo test --no-default-features
        run: cargo test --no-default-features --verbose
